services:
  postgres:
    image: postgres:16-alpine
    container_name: wanza_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanza_backend
    restart: always
    network_mode: "host"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
