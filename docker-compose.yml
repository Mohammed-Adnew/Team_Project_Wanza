services:
  postgres:
    image: postgres:16-alpine
    container_name: wanza_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wanza_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wanza_password}
      POSTGRES_DB: ${POSTGRES_DB:-wanza_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wanza_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wanza_user}:${POSTGRES_PASSWORD:-wanza_password}@postgres:5432/${POSTGRES_DB:-wanza_db}
    depends_on:
      - postgres
    volumes:
      - ./backend:/app/backend

volumes:
  postgres_data:
